name: Claude Code Review

# Automatic review on every PR. This spends subscription quota on every push to
# an open PR — delete this file if you only want @claude mentions.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Fork PRs don't get repository secrets, so CLAUDE_CODE_OAUTH_TOKEN would be
    # empty and the run would fail on auth. Skip them cleanly rather than
    # reaching for pull_request_target, which would expose that secret to
    # untrusted code. Fork PRs still get a review on demand via @claude.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on correctness, security, error
            handling, and test coverage. Leave inline comments on specific
            lines where you find real problems; skip nitpicks and style points
            already covered by linters. If the change looks good, say so
            briefly rather than inventing findings.
          # A PR diff is untrusted input, so treat this job as sandboxed:
          #   --tools     bounds which built-in tools exist at all. --allowed-tools
          #               only skips permission prompts for tools that are already
          #               available, so it is not a boundary on its own. Edit/Write
          #               are absent, leaving the checkout read-only.
          #   MCP         unaffected by --tools; the inline-comment server is how
          #               Claude posts findings. The action handles the summary
          #               comment itself, so no shell write path is needed — a
          #               Bash(gh pr comment:*) allowance would let injected text
          #               reach a published comment.
          claude_args: |
            --tools "Bash,Read,Grep,Glob"
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*)"
