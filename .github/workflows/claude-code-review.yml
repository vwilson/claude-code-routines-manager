name: Claude Code Review

# Automatic review on every PR. This spends subscription quota on every push to
# an open PR — delete this file if you only want @claude mentions.
on:
  pull_request:
    types: [opened, synchronize]

# Two pushes in quick succession would otherwise leave an older 20-minute review
# still running against a stale checkout, posting findings that resolve against
# whatever the head SHA has become by the time it comments.
concurrency:
  group: claude-review-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Both excluded cases are runs that cannot see CLAUDE_CODE_OAUTH_TOKEN, so
    # they would fail on auth rather than review anything:
    #   forks       secrets are withheld from fork PRs. pull_request_target
    #               would restore the secret by handing it to untrusted code,
    #               which is the trade this job exists to avoid.
    #   dependabot  GitHub runs its pull_request events with fork-like rules —
    #               Actions secrets are unavailable even though the branch is
    #               local, so the same-repo check above passes.
    # Either way, @claude on the PR still works as an on-demand review.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Keep the job's token out of .git/config. Nothing here pushes, and a
          # persisted credential is just one more secret sitting in a file that
          # the review step can read.
          persist-credentials: false

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on correctness, security, error
            handling, and test coverage. Leave inline comments on specific
            lines where you find real problems; skip nitpicks and style points
            already covered by linters. If the change looks good, say so
            briefly rather than inventing findings.
          # A PR diff is untrusted input on a job holding a token, so the tool
          # set is deliberately shell-free:
          #   no Bash    Claude Code treats a fixed set of commands as read-only
          #              and runs them without a prompt in every mode, `echo`
          #              among them. Since the shell expands `$GH_TOKEN` before
          #              echo sees it, any Bash at all is an unpromptable read of
          #              the action's GitHub token, which injected diff text
          #              could then hand to the inline-comment tool. Narrowing
          #              --allowed-tools does not help: that flag only waives
          #              prompts, and these commands never prompt anyway.
          #   --tools    is what actually bounds availability. Read/Grep/Glob
          #              cannot reach process env, and dropping Edit/Write
          #              leaves the checkout read-only.
          #   MCP        unaffected by --tools, so the inline-comment server
          #              still posts findings. Anthropic's own review workflow
          #              runs on this tool alone, so no shell is needed to
          #              review a PR.
          claude_args: |
            --tools "Read,Grep,Glob"
            --allowed-tools "mcp__github_inline_comment__create_inline_comment"
